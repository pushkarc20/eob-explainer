[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eob-explainer"
version = "0.1.0"
description = "Patient-facing FHIR ExplanationOfBenefit explainer (synthetic data only)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2",
  "python-dotenv",
  "presidio-analyzer",
  "anthropic",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
